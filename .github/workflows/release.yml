name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0) — used for manual release'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Windows (portable — no voice, R2 auto-update variant)
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Fetch vosk speech models (voice build)
        run: node scripts/fetch-vosk-model.mjs
      - name: Build Windows (portable — voice, vosk models + sox bundled)
        run: npm run build:win:voice -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload Windows artifacts (both variants → GitHub release)
        uses: actions/upload-artifact@v4
        with:
          name: AC27-Editor-Windows
          path: release/*.exe
          if-no-files-found: error
      - name: Upload to R2 (auto-update — both variants, same bucket)
        # Both AC27Editor.exe and AC27EditorVoice.exe are auto-update sources.
        # Each exe carries a companion .md5 sidecar: the Worker reads it and
        # returns the real MD5 as the ETag header (the updater compares against
        # that; multipart uploads of the large voice exe make R2's own ETag
        # useless, so the sidecar is authoritative for both).
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_REGION: auto
        run: |
          aws s3 cp release/AC27Editor.exe s3://ac27editor/AC27Editor.exe --endpoint-url "$env:AWS_ENDPOINT_URL" --region auto
          $hash = (Get-FileHash -Path release/AC27Editor.exe -Algorithm MD5).Hash.ToLower()
          $hash | Out-File -NoNewline -Encoding ASCII md5.txt
          aws s3 cp md5.txt s3://ac27editor/AC27Editor.exe.md5 --endpoint-url "$env:AWS_ENDPOINT_URL" --region auto --content-type "text/plain"
          aws s3 cp release/AC27EditorVoice.exe s3://ac27editor/AC27EditorVoice.exe --endpoint-url "$env:AWS_ENDPOINT_URL" --region auto
          $voiceHash = (Get-FileHash -Path release/AC27EditorVoice.exe -Algorithm MD5).Hash.ToLower()
          $voiceHash | Out-File -NoNewline -Encoding ASCII voice-md5.txt
          aws s3 cp voice-md5.txt s3://ac27editor/AC27EditorVoice.exe.md5 --endpoint-url "$env:AWS_ENDPOINT_URL" --region auto --content-type "text/plain"

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build macOS (dmg)
        run: npm run build:mac -- --publish never
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC27-Editor-macOS
          path: release/*.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Linux (AppImage + deb)
        run: npm run build:linux -- --publish never
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC27-Editor-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  build-plugin:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build plugin DLL
        # Compiles against the vendored refs in mods/AC27Approach/lib (build-time
        # only — never shipped). SkipDeploy keeps CI from writing into lib/.
        run: dotnet build mods/AC27Approach -c Release -p:GameDir="${{ github.workspace }}\mods\AC27Approach\lib" -p:SkipDeploy=true
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC27-Plugin-Windows
          path: mods/AC27Approach/bin/Release/net6.0/AC27Approach.dll
          if-no-files-found: error
      - name: Upload plugin DLL to R2 (strips-window auto-install source)
        # Serves AC27Approach.dll through the ericpzh.rest/ac27approach* Worker
        # route (public bucket pub-3cf0a07576984a6b82374a2bbc597e59) so the
        # editor's Load-DLL button can download+install it instead of requiring
        # a manual file pick. Bucket: ac27approach (own endpoint, NOT the
        # ac27editor auto-update bucket).
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://66f99fd03d3228c43e0acb85f7b8298f.r2.cloudflarestorage.com
          AWS_REGION: auto
        run: |
          aws s3 cp mods/AC27Approach/bin/Release/net6.0/AC27Approach.dll s3://ac27approach/AC27Approach.dll --endpoint-url "$env:AWS_ENDPOINT_URL" --region auto

  release:
    needs: [build-windows, build-macos, build-linux, build-plugin]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AC27-Editor-Windows
          path: release-windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: AC27-Editor-macOS
          path: release-macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: AC27-Editor-Linux
          path: release-linux

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: AC27-Plugin-Windows
          path: release-plugin

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: $(cat $GITHUB_OUTPUT)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            release-windows/*.exe
            release-macos/*.dmg
            release-linux/*.AppImage
            release-linux/*.deb
            release-plugin/*.dll
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- STEAM WORKSHOP AUTO-DEPLOY (content + bilingual title/description) ---
      # Workshop gets ONLY AC27Editor.exe (no voice) — GitHub Release keeps both.
      - name: Prepare Workshop content (filter Voice.exe)
        run: |
          echo "=== Workshop content filter ==="
          ls -lh release-windows/
          mkdir -p steam-workshop-content
          # Only the non-voice exe goes to Steam Workshop (user request)
          cp -v release-windows/AC27Editor.exe steam-workshop-content/
          # Fail if Voice exe accidentally copied
          if ls steam-workshop-content/*Voice* 1>/dev/null 2>&1; then
            echo "::error::Voice exe must NOT be in Workshop content"
            ls -lh steam-workshop-content/
            exit 1
          fi
          ls -lh steam-workshop-content/
          echo "Workshop content ready (GitHub Release still has both exes)"

      - name: Validate Workshop content exists
        run: |
          echo "=== Workshop preflight ==="
          ls -lh steam-workshop-content/ || (echo "::error::steam-workshop-content missing" && exit 1)
          test -f icon.png || (echo "::error::icon.png missing at repo root" && exit 1)
          # workshop static files — title constant AC27Editor, no generation
          test -f workshop/title.txt || (echo "::error::workshop/title.txt missing" && exit 1)
          test -f workshop/description_en.txt || (echo "::error::workshop/description_en.txt missing" && exit 1)
          test -f workshop/description_zh.txt || (echo "::error::workshop/description_zh.txt missing" && exit 1)
          grep -q "^AC27Editor$" workshop/title.txt || (echo "::error::workshop/title.txt must be exactly AC27Editor" && exit 1)
          echo "title: $(cat workshop/title.txt)"
          wc -c workshop/description_en.txt workshop/description_zh.txt
          echo "content ready"

      - name: Generate Steam TOTP (for steamcmd login)
        id: steam-totp
        uses: CyberAndrii/steam-totp@v1
        with:
          shared_secret: ${{ secrets.STEAM_SHARED_SECRET }}

      - name: Install SteamCMD
        run: |
          sudo apt-get update && sudo apt-get install -y steamcmd || {
            mkdir -p "$HOME/steamcmd"
            curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf - -C "$HOME/steamcmd"
            echo "$HOME/steamcmd" >> "$GITHUB_PATH"
          }
          # Ensure steamcmd is on PATH for next step
          if [ -x "$HOME/steamcmd/steamcmd.sh" ]; then echo "$HOME/steamcmd" >> "$GITHUB_PATH"; fi
          which steamcmd || which steamcmd.sh || ls -R "$HOME/steamcmd" | head -n 20

      - name: Generate Workshop VDF (content-only — title/description handled via i18n step)
        run: |
          WS_CONTENT="${{ github.workspace }}/steam-workshop-content"
          WS_PREVIEW="${{ github.workspace }}/icon.png"
          WS_CHANGELOG="Release ${{ steps.version.outputs.version }} — automated Workshop update via GitHub Actions."
          # NOTE: title/description intentionally OMITTED here — they are set per-language
          # via the i18n step (ISteamUGC::SetItemUpdateLanguage). Omitting preserves
          # existing localized values if i18n step is skipped. Preview/visibility kept.
          cat > "${{ github.workspace }}/.github/workflows/upload_mod.vdf" <<VDF
          "workshopitem"
          {
              "appid"           "4004140"
              "publishedfileid" "3793213548"
              "contentfolder"   "$WS_CONTENT"
              "previewfile"     "$WS_PREVIEW"
              "visibility"      "0"
              "changenote"      "$WS_CHANGELOG"
          }
          VDF
          echo "--- Generated VDF (content-only) ---"
          cat "${{ github.workspace }}/.github/workflows/upload_mod.vdf"
          test -d "$WS_CONTENT" || (echo "::error::contentfolder not found: $WS_CONTENT" && exit 1)
          test -f "$WS_PREVIEW" || (echo "::error::previewfile not found: $WS_PREVIEW" && exit 1)
          test -n "$(ls -A "$WS_CONTENT")" || (echo "::error::contentfolder empty" && exit 1)

      - name: Publish Workshop content (steamcmd)
        run: |
          set -e
          VDF="${{ github.workspace }}/.github/workflows/upload_mod.vdf"
          # Prefer TOTP if available, fallback to raw password (configVdf method also works if STEAM_CONFIG_VDF set)
          if [ -n "${{ steps.steam-totp.outputs.code }}" ]; then
            echo "Logging in with TOTP..."
            steamcmd +login "${{ secrets.STEAM_USERNAME }}" "${{ secrets.STEAM_PASSWORD }}" "${{ steps.steam-totp.outputs.code }}" +workshop_build_item "$VDF" +quit
          elif [ -n "${{ secrets.STEAM_CONFIG_VDF }}" ]; then
            echo "Logging in with configVdf..."
            mkdir -p "$HOME/Steam/config"
            echo "${{ secrets.STEAM_CONFIG_VDF }}" | base64 -d > "$HOME/Steam/config/config.vdf" 2>/dev/null || echo "${{ secrets.STEAM_CONFIG_VDF }}" > "$HOME/Steam/config/config.vdf"
            steamcmd +login "${{ secrets.STEAM_USERNAME }}" +workshop_build_item "$VDF" +quit
          else
            echo "Logging in with password only (will fail if MFA required)..."
            steamcmd +login "${{ secrets.STEAM_USERNAME }}" "${{ secrets.STEAM_PASSWORD }}" +workshop_build_item "$VDF" +quit
          fi

      - name: Push bilingual title/description (Steam language switcher)
        env:
          STEAM_PUBLISHER_KEY: ${{ secrets.STEAM_PUBLISHER_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          # Title is constant AC27Editor (workshop/title.txt), descriptions are static files
          # No generation — files are source of truth per user request.
          # Uses ISteamUGC::SetItemUpdateLanguage equivalent via Web API (english/schinese).
          # Skips gracefully if no publisher key is set (content upload already done).
          node scripts/update-workshop-i18n.mjs || echo "::warning::i18n push failed — content was still uploaded, title/description unchanged"
