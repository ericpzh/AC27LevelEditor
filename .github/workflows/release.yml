name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0) — used for manual release'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows (portable — no voice, R2 auto-update variant)
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Fetch vosk speech models (voice build)
        run: node scripts/fetch-vosk-model.mjs

      - name: Build Windows (portable — voice, vosk models + sox bundled)
        run: npm run build:win:voice -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts (both variants → GitHub release)
        uses: actions/upload-artifact@v4
        with:
          name: AC27-Editor-Windows
          path: release/*.exe
          if-no-files-found: error

      - name: Upload to R2 (auto-update — NORMAL variant only, never the voice exe)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_REGION: auto
        run: |
          aws s3 cp release/AC27Editor.exe s3://ac27editor/AC27Editor.exe --endpoint-url "$env:AWS_ENDPOINT_URL" --region auto
          $hash = (Get-FileHash -Path release/AC27Editor.exe -Algorithm MD5).Hash.ToLower()
          $hash | Out-File -NoNewline -Encoding ASCII md5.txt
          aws s3 cp md5.txt s3://ac27editor/AC27Editor.exe.md5 --endpoint-url "$env:AWS_ENDPOINT_URL" --region auto --content-type "text/plain"

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS (dmg)
        run: npm run build:mac -- --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC27-Editor-macOS
          path: release/*.dmg
          if-no-files-found: error

  build-plugin:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build plugin DLL
        # Compiles against the vendored refs in mods/AC27Appoarch/lib (build-time
        # only — never shipped). SkipDeploy keeps CI from writing into lib/.
        run: dotnet build mods/AC27Appoarch -c Release -p:GameDir="${{ github.workspace }}\mods\AC27Appoarch\lib" -p:SkipDeploy=true

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC27-Plugin-Windows
          path: mods/AC27Appoarch/bin/Release/net6.0/AC27Appoarch.dll
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos, build-plugin]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AC27-Editor-Windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: AC27-Editor-macOS

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: AC27-Plugin-Windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.exe
            *.dmg
            *.dll
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
