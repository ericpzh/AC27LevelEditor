name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0) — used for manual release'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Windows (portable — no voice, R2 auto-update variant)
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Fetch vosk speech models (voice build)
        run: node scripts/fetch-vosk-model.mjs
      - name: Build Windows (portable — voice, vosk models + sox bundled)
        run: npm run build:win:voice -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Build Windows (workshop — no auto-update, Steam handles updates)
        run: npm run build:win:workshop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload Windows artifacts (normal+voice → GitHub release + R2)
        uses: actions/upload-artifact@v4
        with:
          name: AC27-Editor-Windows
          path: |
            release/AC27Editor.exe
            release/AC27EditorVoice.exe
          if-no-files-found: error
      - name: Upload Workshop artifact (workshop-only, no auto-update)
        uses: actions/upload-artifact@v4
        with:
          name: AC27-Editor-Workshop
          path: release/AC27EditorWorkshop.exe
          if-no-files-found: error
      - name: Upload to R2 (auto-update — both variants, same bucket)
        # Both AC27Editor.exe and AC27EditorVoice.exe are auto-update sources.
        # Each exe carries a companion .md5 sidecar: the Worker reads it and
        # returns the real MD5 as the ETag header (the updater compares against
        # that; multipart uploads of the large voice exe make R2's own ETag
        # useless, so the sidecar is authoritative for both).
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_REGION: auto
        run: |
          aws s3 cp release/AC27Editor.exe s3://ac27editor/AC27Editor.exe --endpoint-url "$env:AWS_ENDPOINT_URL" --region auto
          $hash = (Get-FileHash -Path release/AC27Editor.exe -Algorithm MD5).Hash.ToLower()
          $hash | Out-File -NoNewline -Encoding ASCII md5.txt
          aws s3 cp md5.txt s3://ac27editor/AC27Editor.exe.md5 --endpoint-url "$env:AWS_ENDPOINT_URL" --region auto --content-type "text/plain"
          aws s3 cp release/AC27EditorVoice.exe s3://ac27editor/AC27EditorVoice.exe --endpoint-url "$env:AWS_ENDPOINT_URL" --region auto
          $voiceHash = (Get-FileHash -Path release/AC27EditorVoice.exe -Algorithm MD5).Hash.ToLower()
          $voiceHash | Out-File -NoNewline -Encoding ASCII voice-md5.txt
          aws s3 cp voice-md5.txt s3://ac27editor/AC27EditorVoice.exe.md5 --endpoint-url "$env:AWS_ENDPOINT_URL" --region auto --content-type "text/plain"

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build macOS (dmg)
        run: npm run build:mac -- --publish never
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC27-Editor-macOS
          path: release/*.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Linux (AppImage + deb)
        run: npm run build:linux -- --publish never
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC27-Editor-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  build-plugin:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build plugin DLL
        # Compiles against the vendored refs in mods/AC27Approach/lib (build-time
        # only — never shipped). SkipDeploy keeps CI from writing into lib/.
        run: dotnet build mods/AC27Approach -c Release -p:GameDir="${{ github.workspace }}\mods\AC27Approach\lib" -p:SkipDeploy=true
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: AC27-Plugin-Windows
          path: mods/AC27Approach/bin/Release/net6.0/AC27Approach.dll
          if-no-files-found: error
      - name: Upload plugin DLL to R2 (strips-window auto-install source)
        # Serves AC27Approach.dll through the ericpzh.rest/ac27approach* Worker
        # route (public bucket pub-3cf0a07576984a6b82374a2bbc597e59) so the
        # editor's Load-DLL button can download+install it instead of requiring
        # a manual file pick. Bucket: ac27approach (own endpoint, NOT the
        # ac27editor auto-update bucket).
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://66f99fd03d3228c43e0acb85f7b8298f.r2.cloudflarestorage.com
          AWS_REGION: auto
        run: |
          aws s3 cp mods/AC27Approach/bin/Release/net6.0/AC27Approach.dll s3://ac27approach/AC27Approach.dll --endpoint-url "$env:AWS_ENDPOINT_URL" --region auto

  release:
    needs: [build-windows, build-macos, build-linux, build-plugin]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AC27-Editor-Windows
          path: release-windows

      - name: Download Workshop artifact
        uses: actions/download-artifact@v4
        with:
          name: AC27-Editor-Workshop
          path: release-workshop

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: AC27-Editor-macOS
          path: release-macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: AC27-Editor-Linux
          path: release-linux

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: AC27-Plugin-Windows
          path: release-plugin

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: $(cat $GITHUB_OUTPUT)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            release-windows/*.exe
            release-macos/*.dmg
            release-linux/*.AppImage
            release-linux/*.deb
            release-plugin/*.dll
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- STEAM WORKSHOP AUTO-DEPLOY (content + bilingual title/description) ---
      # Workshop gets AC27EditorWorkshop.exe (no auto-update) — GitHub Release keeps normal+voice (auto-update).
      - name: Prepare Workshop content (workshop variant, no Voice)
        run: |
          echo "=== Workshop content (workshop build, no auto-update) ==="
          ls -lh release-windows/ release-workshop/ release-plugin/
          mkdir -p steam-workshop-content
          # Workshop exe is AC27EditorWorkshop.exe with workshop.json marker (auto-update disabled) — keep workshop name
          cp -v release-workshop/AC27EditorWorkshop.exe steam-workshop-content/
          # Workshop also ships the plugin DLL alongside the exe so the Workshop
          # build can auto-install from local content instead of R2 (Steam
          # Workshop handles updates; no network HEAD). Either a sibling file
          # or the exe's bundled resources/AC27Approach.dll is accepted — we
          # ship the sibling for visibility; the exe may also contain a bundled
          # copy if the plugin artifact existed at workshop-build time.
          if [ -f release-plugin/AC27Approach.dll ]; then
            cp -v release-plugin/AC27Approach.dll steam-workshop-content/
            echo "Workshop plugin DLL copied (auto-install source)"
            ls -lh steam-workshop-content/AC27Approach.dll
            sha256sum steam-workshop-content/AC27Approach.dll || certutil -hashfile steam-workshop-content/AC27Approach.dll SHA256 || true
          else
            echo "::warning::release-plugin/AC27Approach.dll not found — Workshop will have no bundled plugin (auto-install will try R2 fallback)"
            ls -lh release-plugin/ || true
          fi
          # Also ensure no stray rename exists
          rm -f steam-workshop-content/AC27Editor.exe 2>/dev/null || true
          # Safety: Voice must NOT be in Workshop
          if ls steam-workshop-content/*Voice* 1>/dev/null 2>&1; then
            echo "::error::Voice exe must NOT be in Workshop content"
            ls -lh steam-workshop-content/
            exit 1
          fi
          ls -lh steam-workshop-content/
          echo "Workshop content ready (workshop exe + bundled plugin DLL; GitHub still has normal+Voice)"

      - name: Validate Workshop content exists
        run: |
          echo "=== Workshop preflight ==="
          ls -lh steam-workshop-content/ || (echo "::error::steam-workshop-content missing" && exit 1)
          test -f icon.png || (echo "::error::icon.png missing at repo root" && exit 1)
          # workshop static files — title constant AC27Editor, no generation
          test -f workshop/title.txt || (echo "::error::workshop/title.txt missing" && exit 1)
          test -f workshop/description_en.txt || (echo "::error::workshop/description_en.txt missing" && exit 1)
          test -f workshop/description_zh.txt || (echo "::error::workshop/description_zh.txt missing" && exit 1)
          grep -q "^AC27Editor$" workshop/title.txt || (echo "::error::workshop/title.txt must be exactly AC27Editor" && exit 1)
          echo "title: $(cat workshop/title.txt)"
          wc -c workshop/description_en.txt workshop/description_zh.txt
          echo "content ready"

      - name: Install SteamCMD
        run: |
          set -e
          # Try apt install (needs i386 + 32-bit libs) — but fallback tarball is more reliable on GH runners
          if ! command -v steamcmd >/dev/null 2>&1; then
            echo "Installing steamcmd via tarball..."
            mkdir -p "$HOME/steamcmd"
            curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf - -C "$HOME/steamcmd"
            chmod +x "$HOME/steamcmd/steamcmd.sh"
            # Provide both names on PATH
            ln -sf "$HOME/steamcmd/steamcmd.sh" "$HOME/steamcmd/steamcmd" 2>/dev/null || true
            echo "$HOME/steamcmd" >> "$GITHUB_PATH"
            # Also make available in current step
            export PATH="$HOME/steamcmd:$PATH"
          fi
          # Also try apt for 32-bit deps (best-effort, don't fail job)
          sudo dpkg --add-architecture i386 2>/dev/null || true
          sudo apt-get update -qq 2>&1 | tail -n 5 || true
          sudo apt-get install -y -qq lib32gcc-s1 lib32stdc++6 libc6-i386 libcurl4-gnutls-dev 2>&1 | tail -n 5 || true
          # Verify
          export PATH="$HOME/steamcmd:$PATH"
          which steamcmd || which steamcmd.sh || (ls -lh "$HOME/steamcmd/" && echo "PATH=$PATH")
          steamcmd +quit 2>&1 | head -n 5 || "$HOME/steamcmd/steamcmd.sh" +quit 2>&1 | head -n 5 || true

      - name: Generate Workshop VDF (content-only — title/description/preview handled separately)
        run: |
          WS_CONTENT="${{ github.workspace }}/steam-workshop-content"
          WS_CHANGELOG="Release ${{ steps.version.outputs.version }} — automated Workshop update via GitHub Actions."
          # NOTE: title/description intentionally OMITTED — set per-language via i18n step
          # (ISteamUGC::SetItemUpdateLanguage). previewfile OMITTED — preserves existing
          # Workshop thumbnail (per user request: don't touch images). Only content+changenote.
          cat > "${{ github.workspace }}/.github/workflows/upload_mod.vdf" <<VDF
          "workshopitem"
          {
              "appid"           "4004140"
              "publishedfileid" "3793213548"
              "contentfolder"   "$WS_CONTENT"
              "visibility"      "0"
              "changenote"      "$WS_CHANGELOG"
          }
          VDF
          echo "--- Generated VDF (content-only, no image) ---"
          cat "${{ github.workspace }}/.github/workflows/upload_mod.vdf"
          test -d "$WS_CONTENT" || (echo "::error::contentfolder not found: $WS_CONTENT" && exit 1)
          test -n "$(ls -A "$WS_CONTENT")" || (echo "::error::contentfolder empty" && exit 1)

      - name: Publish Workshop content (steamcmd — configVdf only, no TOTP)
        run: |
          set -e
          VDF="${{ github.workspace }}/.github/workflows/upload_mod.vdf"
          # Resolve steamcmd binary (apt = steamcmd, tarball = steamcmd.sh)
          STEAMCMD="steamcmd"
          if ! command -v "$STEAMCMD" >/dev/null 2>&1; then
            if command -v steamcmd.sh >/dev/null 2>&1; then STEAMCMD="steamcmd.sh"
            elif [ -x "$HOME/steamcmd/steamcmd.sh" ]; then STEAMCMD="$HOME/steamcmd/steamcmd.sh"
            elif [ -x "$HOME/steamcmd/steamcmd" ]; then STEAMCMD="$HOME/steamcmd/steamcmd"
            fi
          fi
          echo "Using STEAMCMD=$STEAMCMD"
          if [ -z "${{ secrets.STEAM_CONFIG_VDF }}" ]; then
            echo "::warning::STEAM_CONFIG_VDF not set — skipping Workshop upload (GitHub Release already done). To enable Workshop:"
            echo "  steamcmd +login ${{ secrets.STEAM_USERNAME }} YOURPASS +quit   # enter Android code"
            echo "  steamcmd +login ${{ secrets.STEAM_USERNAME }} +quit            # should not prompt"
            echo "  cat config/config.vdf | base64 -w0   # paste as secret STEAM_CONFIG_VDF"
            exit 0
          fi
          echo "Logging in with configVdf..."
          mkdir -p "$HOME/Steam/config"
          CFG="$HOME/Steam/config/config.vdf"
          if echo "${{ secrets.STEAM_CONFIG_VDF }}" | base64 -d > "$CFG" 2>/dev/null; then
            echo "Secret decoded from base64 OK"
          else
            echo "::warning::STEAM_CONFIG_VDF is not valid base64 — wrote raw content instead"
            echo "${{ secrets.STEAM_CONFIG_VDF }}" > "$CFG"
          fi
          # New steamcmd builds keep logs/config under ~/Steam, but the tarball
          # root (~/steamcmd) is where some builds resolve the Steam path —
          # seed both so either location finds the cached credentials.
          mkdir -p "$HOME/steamcmd/config"
          cp -f "$CFG" "$HOME/steamcmd/config/config.vdf"
          echo "config.vdf: $(wc -c < "$CFG") bytes at $CFG"
          # Preflight: ConnectCache holds the cached login token that makes
          # passwordless +login work. An empty ConnectCache (or non-VDF content)
          # means the secret was encoded before steamcmd ever saved a token —
          # +login would hit the password prompt and die (no TTY in CI).
          if ! grep -q '"ConnectCache"' "$CFG"; then
            echo "::error::Decoded STEAM_CONFIG_VDF is not a Steam config.vdf (no ConnectCache key). Re-encode the config.vdf from your steamcmd folder as single-line base64 (no certutil headers, no line wrapping)."
            exit 1
          fi
          CACHE_STATE=$(awk '/"ConnectCache"/{f=1;next} f{line=$0; gsub(/^[ \t]+|[ \t\r]+$/,"",line); if(line=="{"){o=1;next} if(o){ if(line=="}") print "EMPTY"; else print "POPULATED"; exit }}' "$CFG")
          echo "ConnectCache: ${CACHE_STATE:-UNRECOGNIZED}"
          if [ "$CACHE_STATE" != "POPULATED" ]; then
            echo "::error::config.vdf has an EMPTY ConnectCache — no cached login token inside. steamcmd never saved one for this account. Fix locally: 'steamcmd +login <user>' (password + Steam Guard code if asked), then confirm 'steamcmd +login <user> +quit' logs in WITHOUT 'Cached credentials not found', and only then re-base64 config.vdf into STEAM_CONFIG_VDF."
            exit 1
          fi
          echo "Accounts recorded in config.vdf:"
          awk '/"Accounts"/{f=1;next} f{line=$0; gsub(/^[ \t]+|[ \t\r]+$/,"",line); if(!s){ if(line=="{"){s=1;d=1} next } if(line=="{"){d++;next} if(line=="}"){d--; if(d==0)exit; next} if(d==1 && line ~ /^"[^"]*"$/){gsub(/"/,"",line); print "  - " line}}' "$CFG"
          if ! grep -qi "\"${{ secrets.STEAM_USERNAME }}\"" "$CFG"; then
            echo "::warning::STEAM_USERNAME '${{ secrets.STEAM_USERNAME }}' not found in config.vdf — cached tokens are stored per account name; a mismatch will fail login."
          fi
          echo "Running steamcmd: +login (user: ${{ secrets.STEAM_USERNAME }}) +workshop_build_item $(basename "$VDF") +quit"
          OUT="$RUNNER_TEMP/steamcmd_publish.log"
          set +e
          "$STEAMCMD" +login "${{ secrets.STEAM_USERNAME }}" +workshop_build_item "$VDF" +quit 2>&1 | tee "$OUT"
          RC=${PIPESTATUS[0]}
          set -e
          echo "steamcmd exit code: $RC"
          # steamcmd sometimes exits 0 on failure, so also classify its output.
          if grep -qi "successfully sent workshop item update" "$OUT"; then
            echo "::notice::Workshop item update CONFIRMED by steamcmd output."
          elif grep -q "Invalid Password" "$OUT"; then
            echo "::error::Invalid Password — the cached token is stale/revoked. Locally: 'steamcmd +login <user>' (password + Steam Guard), verify passwordless 'steamcmd +login <user> +quit', then re-encode config.vdf into STEAM_CONFIG_VDF."
            exit 1
          elif grep -q "Cached credentials not found" "$OUT"; then
            echo "::error::No cached token in the decoded config.vdf (empty ConnectCache). Re-encode a config.vdf from a steamcmd install where passwordless +login works."
            exit 1
          elif [ "$RC" -ne 0 ]; then
            echo "::error::steamcmd failed (exit $RC) — full output above."
          else
            echo "::warning::steamcmd exited 0 but no success confirmation found in output — verify the workshop item manually."
          fi
          exit "$RC"

      - name: Push bilingual title/description (Steam language switcher)
        env:
          STEAM_PUBLISHER_KEY: ${{ secrets.STEAM_PUBLISHER_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          # Title is constant AC27Editor (workshop/title.txt), descriptions are static files
          # No generation — files are source of truth per user request.
          # Uses ISteamUGC::SetItemUpdateLanguage equivalent via Web API (english/schinese).
          # Skips gracefully if no publisher key is set (content upload already done).
          node scripts/update-workshop-i18n.mjs || echo "::warning::i18n push failed — content was still uploaded, title/description unchanged"
